<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 168"><style><![CDATA[
  @page { size: A3 portrait; margin: 11mm; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #eee; }

  body {
    width: 275mm;
    margin: 0 auto;
    background: #fff;
    color: #000;
    font-family: "PingFang SC", "Hiragino Sans GB", "Hiragino Sans", "Microsoft YaHei", sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .howto {
    width: 275mm; margin: 14px auto; padding: 14px 18px;
    border: 2px solid #000; background: #fffbe6;
    font-size: 13px; line-height: 1.75;
  }
  .howto b { font-size: 14px; }
  .howto ol { margin: 6px 0 0 20px; }

  @media print {
    html { background: #fff; }
    .howto { display: none; }
    body { margin: 0; }
  }

  .sheet { break-after: page; page-break-after: always; }
  .sheet:last-of-type { break-after: auto; page-break-after: auto; }

  /* ---- header ---- */
  .head {
    height: 18mm;
    display: flex; align-items: flex-end; justify-content: space-between;
    border-bottom: 0.8mm solid #000; padding-bottom: 2mm;
  }
  .head h1 { font-size: 15pt; font-weight: 700; }
  .head h1 span { font-size: 9.5pt; font-weight: 400; color: #444; margin-left: 3mm; }
  .key { font-size: 7.5pt; color: #333; display: flex; gap: 4mm; align-items: center; }
  .key i { display: inline-block; width: 6mm; height: 1mm; vertical-align: 0.6mm; margin-right: 1mm; }
  .key i.k1 { background: #b4b4b4; }
  .key i.k2 { background: #000; }
  .key i.k3 { background: #000; height: 2.4mm; width: 3.5mm; vertical-align: -0.1mm; }

  /* ---- figure grid ---- */
  .grid {
    margin-top: 5mm;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5mm;
  }

  .card {
    border: 0.3mm solid #000;
    padding: 2mm 2.5mm 2.5mm;
    display: flex; flex-direction: column; gap: 1.2mm;
  }
  .card h3 {
    font-size: 9.5pt; font-weight: 700;
    display: flex; align-items: baseline; gap: 1.5mm;
  }
  .card h3 b { font-size: 7.5pt; font-weight: 700; }
  .card h3 em { font-style: normal; font-size: 6.5pt; font-weight: 400; color: #555; }

  .card .meta {
    display: flex; align-items: baseline; gap: 2mm;
    font-size: 7pt; color: #111;
    padding-bottom: 1mm;
    border-bottom: 0.25mm solid #bbb;
  }
  .card .meta .s { font-weight: 700; }
  .card .meta .r { margin-left: auto; color: #333; white-space: nowrap; }
  .card .meta .r b { font-weight: 700; }

  .card svg { width: 100%; height: auto; display: block; }
  .card p { font-size: 7.5pt; line-height: 1.5; color: #111; }
  .card p strong { font-weight: 700; }

  /* ---- svg primitives, tuned for B&W print ---- */
  .gh, .ac { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .gh      { stroke: #b4b4b4; stroke-width: 2.6; }
  .ac      { stroke: #000;    stroke-width: 3.1; }
  .gh-h    { fill: #b4b4b4; }
  .ac-h    { fill: #000; }
  .load    { fill: #000; }
  .load-gh { fill: #b4b4b4; }
  .gnd     { fill: none; stroke: #c8c8c8; stroke-width: 2; stroke-dasharray: 2 5; }
  .rig     { fill: none; stroke: #8a8a8a; stroke-width: 2.4; stroke-linecap: round; }
  .bar     { fill: none; stroke: #555;    stroke-width: 4.5; stroke-linecap: round; }
  .pth     { fill: none; stroke: #000; stroke-width: 2; stroke-dasharray: 4 4; }
  .arwh    { fill: #000; }
  .ldr     { fill: none; stroke: #999; stroke-width: 1.2; }
  .lbl     { fill: #000; font-size: 11px; font-weight: 700;
             font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; }
  .lbl2    { fill: #666; font-size: 10.5px; font-weight: 500;
             font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; }

  /* ---- reference block ---- */
  .ref { margin-top: 6mm; }
  .ref h2 {
    font-size: 10pt; font-weight: 700;
    border-bottom: 0.5mm solid #000; padding-bottom: 1.5mm; margin-bottom: 3mm;
  }
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5mm; }
  .box { border: 0.3mm solid #000; padding: 2.5mm 3mm; }
  .box h4 { font-size: 8.5pt; font-weight: 700; margin-bottom: 1.5mm; }
  .box p, .box li { font-size: 7.5pt; line-height: 1.6; color: #111; }
  .box ol { margin-left: 4mm; }
  .box .mono { font-family: "SF Mono", Menlo, monospace; font-size: 7pt; line-height: 1.8; display: block; margin-top: 1mm; }

  /* ---- schedule ---- */
  table.cal { width: 100%; border-collapse: collapse; margin-top: 3mm; }
  table.cal th, table.cal td { border: 0.25mm solid #000; text-align: center; font-size: 7.5pt; }
  table.cal th { height: 6mm; font-weight: 700; background: #eee; }
  table.cal td { height: 11mm; }
  table.cal td.wk { font-weight: 700; width: 14mm; background: #eee; }
  table.cal td.tr { background: #ddd; }
  table.cal td b { display: block; font-size: 11pt; font-weight: 700; }
  table.cal td em { font-style: normal; font-size: 7pt; }
  table.cal td.rs b { font-weight: 400; color: #777; }

  .foot {
    margin-top: 4mm; border-top: 0.3mm solid #000; padding-top: 2mm;
    font-size: 7.5pt; color: #444; line-height: 1.55;
  }

.ac,.ac-h,.load,.pth,.lbl{visibility:hidden}]]></style><defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
      <path class="arwh" d="M0.5 1 L9 5 L0.5 9 Z"></path>
    </marker>
  </defs>
        <line class="gnd" x1="14" y1="152" x2="196" y2="152"/>
        <polyline class="rig" points="76,114 76,42 120,42 120,114"/>
        <line class="rig" x1="98" y1="114" x2="98" y2="126"/>
        <circle class="ac-h" cx="98" cy="32" r="8"/>
        <polyline class="ac" points="98,44 98,98"/>
        <polyline class="ac" points="82,50 114,50"/>
        <polyline class="ac" points="88,98 108,98"/>
        <polyline class="ac" points="88,98 86,126 86,152"/>
        <polyline class="ac" points="108,98 110,126 110,152"/>
        <polyline class="gh" points="82,50 80,74 78,94"/>
        <polyline class="gh" points="114,50 116,74 118,94"/>
        <rect class="load-gh" x="69" y="92" width="18" height="9" rx="2"/>
        <rect class="load-gh" x="109" y="92" width="18" height="9" rx="2"/>
        <polyline class="ac" points="82,50 58,44 46,60"/>
        <polyline class="ac" points="114,50 138,44 150,60"/>
        <rect class="load" x="37" y="58" width="18" height="9" rx="2"/>
        <rect class="load" x="141" y="58" width="18" height="9" rx="2"/>
        <path class="pth" d="M128 88 Q 154 78 156 68" marker-end="url(#arw)"/>
        <text class="lbl" x="106" y="104">肘领先展开</text>
        <path class="ldr" d="M150 34 L140 42"/>
        <text class="lbl2" x="140" y="30">屈肘＝减力臂</text>
        <path class="ldr" d="M48 120 L76 108"/>
        <text class="lbl2" x="14" y="126">胸贴椅背</text>
      </svg>