# Pulls a freshly published image onto the home server and restarts it.
#
# This is a reusable workflow — it does nothing on its own. Any repository that
# publishes an image to GHCR and runs it with compose on the same server can
# deploy with about fifteen lines:
#
#   deploy:
#     needs: publish
#     uses: uqiu/forge/.github/workflows/deploy-to-server.yml@main
#     with:
#       dir: ~/forge
#       health-url: http://127.0.0.1:8081/api/health
#     secrets: inherit
#
# It lives in this repository because this one is public: a reusable workflow in
# a public repository can be called from anywhere with no access configuration,
# while one in a private repository has to be granted access per caller. If
# these ever outgrow Forge, moving the file to a dedicated repo is a file move
# plus one line at each call site.
#
# The caller still needs its own copies of the secrets below — GitHub has no
# account-wide secrets for personal accounts. See docs/deploy.md.
name: Deploy to home server

on:
  workflow_call:
    inputs:
      dir:
        description: Directory on the server holding the compose file (a git checkout is synced first, if it is one).
        required: true
        type: string
      compose-dir:
        description: Subdirectory of `dir` holding compose.yaml, when it isn't at the top.
        type: string
        default: '.'
      auto-clone:
        description: >-
          Clone the repository when `dir` doesn't exist yet, so a new project
          needs nothing done on the server by hand. Anonymous HTTPS, so it only
          works for a public repository; a private one needs credentials on the
          server and should be cloned there once instead.
        type: boolean
        default: true
      health-url:
        description: URL to poll from inside the server once the container restarts.
        required: true
        type: string
      health-timeout:
        description: Seconds to wait for the health check before failing the deploy.
        type: number
        default: 60
      diagnostics:
        description: >-
          Print `tailscale status` when the tailnet check runs. Leave this off
          for a public repository: the output lists every device on the tailnet
          and Actions logs on public repositories are world-readable.
        type: boolean
        default: false
    secrets:
      TS_OAUTH_CLIENT_ID:
        required: true
      TS_OAUTH_SECRET:
        required: true
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_KNOWN_HOSTS:
        required: true
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The server sits behind NAT with no public entrance. Once the runner
      # joins the tailnet it can SSH in as if it were on the LAN.
      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # That action retries five times and then returns 0 regardless, so a
      # failure to join leaves the job running in a disconnected state until it
      # dies at the ssh timeout — miles from the actual cause. Stop here instead.
      - name: Verify the tailnet connection
        env:
          DIAGNOSTICS: ${{ inputs.diagnostics }}
        run: |
          # --json keeps the device list out of the log; the exit code is what
          # matters. BackendState is "Running" only once we are actually up.
          state=$(tailscale status --json | jq -r '.BackendState')
          if [ "$state" != "Running" ]; then
            echo "tailscaled is $state, not Running — the runner never joined the tailnet."
            echo "Check that the OAuth client is valid and that tag:ci exists in the ACL."
            exit 1
          fi
          if [ "$DIAGNOSTICS" = "true" ]; then
            tailscale status
            # Ping is diagnostic only: with no direct path it relays over DERP,
            # which SSH still works over, so a failure here is not fatal.
            tailscale ping --timeout=5s -c 3 "${{ secrets.DEPLOY_HOST }}" || true
          fi

      - name: Set up the SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host fingerprint against a man-in-the-middle; the value
          # comes from ssh-keyscan on the server.
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Pull the new image and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DIR: ${{ inputs.dir }}
          COMPOSE_DIR: ${{ inputs.compose-dir }}
          AUTO_CLONE: ${{ inputs.auto-clone }}
          CLONE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          # Unquoted heredoc: the variables above expand here, on the runner,
          # and the resulting script is what the server runs.
          ssh -o BatchMode=yes "$USER@$HOST" bash -euo pipefail <<EOF
            if [ ! -d "$DIR" ]; then
              if [ "$AUTO_CLONE" != "true" ]; then
                echo "$DIR does not exist and auto-clone is off." >&2
                exit 1
              fi
              echo "First deploy — cloning into $DIR"
              git clone --quiet "$CLONE_URL" "$DIR"
            fi
            cd "$DIR"
            # The compose file may have changed too. Only sync when the
            # directory is a checkout — a server that just holds a compose file
            # copied by hand keeps whatever is there.
            if [ -d .git ]; then
              git fetch --quiet origin main
              git reset --hard --quiet origin/main
            fi
            cd "$COMPOSE_DIR"
            docker compose pull
            docker compose up -d
            # Only dangling images; the sha-tagged ones a rollback needs stay.
            docker image prune -f
          EOF

      - name: Wait for the service to come back
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DIR: ${{ inputs.dir }}
          COMPOSE_DIR: ${{ inputs.compose-dir }}
          HEALTH_URL: ${{ inputs.health-url }}
          TIMEOUT: ${{ inputs.health-timeout }}
        run: |
          # The container's own healthcheck needs a moment; poll rather than sleep.
          deadline=$(( $(date +%s) + TIMEOUT ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if ssh -o BatchMode=yes "$USER@$HOST" "curl -fsS '$HEALTH_URL'" >/dev/null 2>&1; then
              echo "✅ deployed and healthy"
              exit 0
            fi
            sleep 5
          done
          echo "❌ health check timed out after ${TIMEOUT}s; container logs follow:"
          ssh -o BatchMode=yes "$USER@$HOST" \
            "cd '$DIR/$COMPOSE_DIR' && docker compose logs --tail=50"
          exit 1
