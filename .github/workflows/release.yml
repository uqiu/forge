# Publishes the Docker image to this repository's GHCR namespace on every main
# branch update. A manual run can additionally create a versioned tag.
name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Additional image tag (e.g. v0.1.0). "latest" is always pushed.
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only: the deployment target (Unraid) is x86. The arm64 leg
          # ran under QEMU and turned cold-cache builds into 45+ minute
          # ordeals — re-add it here if an ARM host ever joins the fleet.
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ inputs.tag || github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ${{ inputs.tag && format('ghcr.io/{0}:{1}', github.repository, inputs.tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
