name: CI

on:
  pull_request:
  # release.yml calls this before it publishes, so a main push runs these once
  # and the deploy waits on them — rather than testing and shipping in parallel.
  workflow_call:

# This repository's default token is read-write, so that release.yml can hand
# uqiu/cicd the `packages: write` it needs to push the image. Tests need none of
# that, and the default is only a default — so say so here.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:timer
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Tests
        run: python -m pytest backend/tests -q
      - name: Boot check
        run: |
          FORGE_DATA_DIR=/tmp/forge-ci python -m uvicorn backend.main:app --port 8081 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8081/api/health && exit 0
            sleep 1
          done
          echo "backend failed to boot" && exit 1
